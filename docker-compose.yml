services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api.optimized
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: base
      REDIS_PORT: "6379"
    depends_on:
      base:
        condition: service_healthy

  base:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
